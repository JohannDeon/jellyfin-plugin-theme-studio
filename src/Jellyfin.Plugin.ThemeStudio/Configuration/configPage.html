<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Theme Studio</title>
</head>
<body>
    <div id="ThemeStudioConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="Theme Studio">
        <div data-role="content">
            <div class="content-primary">
                <div id="themeStudioAdmin"></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#ThemeStudioConfigPage');
                function mount() {
                    window.ThemeStudio.mountAdmin(page.querySelector('#themeStudioAdmin'));
                }
                page.addEventListener('viewshow', function () {
                    if (window.ThemeStudio) {
                        mount();
                        return;
                    }
                    // The client script was not injected (yet): load it from the plugin directly.
                    var s = document.createElement('script');
                    s.src = ApiClient.getUrl('ThemeStudio/client.js');
                    s.onload = mount;
                    document.head.appendChild(s);
                });
            })();
        </script>
    </div>
</body>
</html>
