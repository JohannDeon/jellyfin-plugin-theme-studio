name: Release

# Publishes a release (and updates manifest.json) whenever the version in the
# .csproj changes on main. Bump <AssemblyVersion> to ship a new version.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: v
        run: |
          csproj=src/Jellyfin.Plugin.ThemeStudio/Jellyfin.Plugin.ThemeStudio.csproj
          version=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' "$csproj")
          abi=$(grep -oPm1 '(?<=<JellyfinVersion>)[^<]+' "$csproj")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "abi=$abi.0" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.v.outputs.exists == 'false'
        run: dotnet test --configuration Release

      - name: Build package
        if: steps.v.outputs.exists == 'false'
        id: pkg
        run: |
          dotnet publish src/Jellyfin.Plugin.ThemeStudio --configuration Release --output out
          zip_name="theme-studio_${{ steps.v.outputs.version }}.zip"
          (cd out && zip -j "../$zip_name" Jellyfin.Plugin.ThemeStudio.dll)
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip_name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" "${{ steps.pkg.outputs.zip }}" \
            --title "Theme Studio ${{ steps.v.outputs.version }}" \
            --generate-notes

      - name: Update manifest.json
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ABI: ${{ steps.v.outputs.abi }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path = "manifest.json"
          data = json.load(open(path, encoding="utf-8"))
          version = os.environ["VERSION"]
          entry = {
              "version": version,
              "changelog": f"https://github.com/{os.environ['REPO']}/releases/tag/v{version}",
              "targetAbi": os.environ["ABI"],
              "sourceUrl": f"https://github.com/{os.environ['REPO']}/releases/download/v{version}/{os.environ['ZIP']}",
              "checksum": os.environ["MD5"],
              "timestamp": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          plugin = data[0]
          plugin["versions"] = [entry] + [v for v in plugin.get("versions", []) if v["version"] != version]
          json.dump(data, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(path, "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish Theme Studio ${{ steps.v.outputs.version }} in manifest.json"
          git push
